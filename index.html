<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austria · August 2026</title>
<style>
  :root{
    --paper:#EFF3EE;
    --ink:#1D2A24;
    --muted:#5C6B62;
    --line:#D8E0D6;
    --sign:#F0BE2E;
    --signink:#241C05;
    --blazered:#C8362B;
    --display:"Avenir Next Condensed","AvenirNextCondensed-DemiBold","Futura","Arial Narrow",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--display);line-height:1.5}

  .topbar{display:flex;align-items:center;gap:10px;padding:16px 20px;max-width:820px;margin:0 auto}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .blaze{display:inline-block;width:20px;height:14px;flex:none;
    background:linear-gradient(180deg,var(--blazered) 0 33%,#fff 33% 66%,var(--blazered) 66% 100%);
    outline:1px solid rgba(29,42,36,.35)}

  /* photo — the highlight */
  .hero{background:#22312B}
  .hero img{display:block;width:100%;height:auto;max-height:72vh;object-fit:cover;object-position:center 40%}
  .hero.noimg{aspect-ratio:1638/1000;max-height:52vh}
  .hero.noimg img{display:none}

  /* signpost chooser */
  .chooser{max-width:820px;margin:0 auto;padding:30px 20px 8px 20px;position:relative}
  .pole{position:absolute;left:28px;top:14px;bottom:0;width:8px;
    background:linear-gradient(90deg,#7A6A52,#9c8a6e 45%,#6d5d47);border-radius:4px}
  .bigsign{
    display:block;position:relative;margin:0 0 18px 22px;
    background:var(--sign);color:var(--signink);text-decoration:none;
    padding:16px 46px 16px 20px;max-width:600px;
    clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%);
    transition:filter .15s ease, transform .15s ease;
  }
  .bigsign:hover{filter:brightness(1.06);transform:translateX(4px)}
  .bigsign .t{display:block;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;font-size:clamp(28px,8vw,40px);line-height:1.02}
  .bigsign .m{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.03em;margin-top:6px;opacity:.8}

  footer{max-width:820px;margin:26px auto 0;padding:0 20px 28px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}

  @media (max-width:640px){
    .bigsign{padding:14px 40px 14px 16px}
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="blaze"></span><span class="eyebrow">Austria · August 2026</span>
</div>

<div class="hero" id="hero">
  <img src="1.jpeg" alt="" onerror="document.getElementById('hero').classList.add('noimg')">
</div>

<nav class="chooser" aria-label="Trips">
  <div class="pole"></div>
  <a class="bigsign" href="salzkammergut.html">
    <span class="t">Alpenglow</span>
    <span class="m">3 DAYS · SALZKAMMERGUT · 6 LAKES · 2 SUMMITS · 1 CUKI BENCH 🪑</span>
  </a>
  <a class="bigsign" href="graz.html">
    <span class="t">Graz</span>
    <span class="m">2 DAYS · 24 WATERFALLS · 168 LADDERS · DINNER AT 754 M</span>
  </a>
</nav>

<footer>maps need internet · everything else works offline</footer>

</body>
</html>
